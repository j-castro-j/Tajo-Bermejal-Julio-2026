<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complejo Minero - Visor Topográfico 3D</title>

  <!-- CesiumJS -->
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  
  <!-- Chart.js para el Perfil Transversal -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0b0e14; color: #fff; }
    #cesiumContainer { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }

    /* Barra Superior */
    .top-bar {
      position: absolute;
      top: 12px;
      left: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(13, 20, 32, 0.85);
      backdrop-filter: blur(8px);
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      z-index: 100;
    }
    
    /* Selector de Zonas */
    .select-zona {
      background: rgba(2, 132, 199, 0.25);
      border: 1px solid #38bdf8;
      color: #38bdf8;
      font-weight: 700;
      font-size: 12px;
      padding: 5px 8px;
      border-radius: 6px;
      outline: none;
      cursor: pointer;
      margin-right: 4px;
    }
    .select-zona option {
      background: #0b111e;
      color: #fff;
    }

    .btn-tool {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #e2e8f0;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s ease;
    }
    .btn-tool:hover { background: rgba(56, 189, 248, 0.2); border-color: #38bdf8; color: #fff; }
    .btn-tool.active { background: #0284c7; border-color: #38bdf8; color: #fff; }
    .btn-tool.danger:hover { background: rgba(239, 68, 68, 0.25); border-color: #ef4444; color: #fca5a5; }

    /* HUD Inferior Izquierdo: Coordenadas Locales */
    #coordenadas-display {
      position: absolute;
      bottom: 12px;
      left: 12px;
      background: rgba(13, 20, 32, 0.88);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 12px;
      font-family: monospace;
      z-index: 100;
      pointer-events: none;
    }
    .hud-title {
      font-size: 9px;
      font-weight: 700;
      color: #94a3b8;
      letter-spacing: 0.8px;
      margin-bottom: 3px;
    }

    /* Panel Inferior: Gráfica de Sección */
    #panel-seccion {
      display: none;
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 230px;
      background: rgba(11, 15, 25, 0.95);
      backdrop-filter: blur(10px);
      border-top: 1px solid rgba(56, 189, 248, 0.3);
      padding: 10px 18px;
      z-index: 200;
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-size: 12px;
    }
    .panel-title { font-weight: 700; color: #c084fc; letter-spacing: 0.5px; }
    .panel-meta { color: #94a3b8; font-family: monospace; font-size: 11px; }
    .panel-meta b { color: #e2e8f0; }
    .btn-close {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 16px;
      cursor: pointer;
      padding: 2px 6px;
    }
    .btn-close:hover { color: #fff; }
    .chart-wrapper { width: 100%; height: 180px; position: relative; }
  </style>
</head>
<body>

  <div id="cesiumContainer"></div>

  <!-- Barra de Herramientas Superior con Selector de Zona -->
  <div class="top-bar">
    <select id="select-zona" class="select-zona" onchange="cambiarZona(this.value)">
      <option value="bermejal" selected>Tajo Bermejal</option>
      <option value="filos">Tajo Los Filos</option>
      <option value="guadalupe">Tajo Guadalupe</option>
    </select>
    <button class="btn-tool" onclick="vistaPlanta()">Planta (2D)</button>
    <button class="btn-tool" onclick="vistaPerspectiva()">Perspectiva 3D</button>
    <button class="btn-tool" id="btn-medir" onclick="activarHerramienta('medir')">📏 Medir</button>
    <button class="btn-tool" id="btn-talud" onclick="activarHerramienta('talud')">📐 Talud</button>
    <button class="btn-tool" id="btn-seccion" onclick="activarHerramienta('seccion')">✂ Sección</button>
    <button class="btn-tool danger" onclick="limpiarTodo()">Borrar</button>
  </div>

  <!-- HUD Coordenadas Locales -->
  <div id="coordenadas-display">
    <div class="hud-title" id="hud-zona-label">MINEPLAN: TAJO BERMEJAL</div>
    <span style="color:#38bdf8;">Este:</span> <span id="hud-e">---</span> &nbsp;
    <span style="color:#38bdf8;">Norte:</span> <span id="hud-n">---</span> &nbsp;
    <span style="color:#facc15;">Cota Z:</span> <span id="hud-z">---</span>
  </div>

  <!-- Panel Inferior: Sección Transversal -->
  <div id="panel-seccion">
    <div class="panel-header">
      <div class="panel-title">PERFIL TRANSVERSAL DE TERRENO</div>
      <div class="panel-meta">
        Longitud: <b id="secLength">0.0 m</b> &nbsp;|&nbsp; 
        Muestras: <b id="secSamples">0</b> &nbsp;|&nbsp; 
        ΔZ: <b id="secDeltaZ">0.0 m</b>
      </div>
      <button class="btn-close" onclick="cerrarSeccion()">✕</button>
    </div>
    <div class="chart-wrapper">
      <canvas id="chartCanvas"></canvas>
    </div>
  </div>

  <script>
    // =========================================================================
    // 1. CREDENCIALES Y CONFIGURACIÓN MULTI-ZONA
    // =========================================================================
    Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJub25jZSI6Im45NTNpVjFfRHVjYmt5ZlYiLCJqdGkiOiJiNGMyMWUxYy1kZTE2LTQ5YTEtYWJkNi0wY2NjNzkzMjQxZTgiLCJpZCI6NDc3MzE0LCJzdWIiOiJqY2FzdHJvaiIsImlzcyI6Imh0dHBzOi8vYXBpLmNlc2l1bS5jb20iLCJhdWQiOiJUb2tlbiBGaWxvcyIsImlhdCI6MTc5MDAxNzc0MX0.iEW8XqGhQngkPeEpgPVsHucynhJuGc95ktO7KxW1AI4'; // Coloca aquí tu token de Cesium Ion

    // Matriz de zonas con sus Asset IDs de Cesium y parámetros validados
    const CONFIG_ZONAS = {
      bermejal: {
        nombre: 'TAJO BERMEJAL',
        assetId: 5179943, // Reemplaza con tu Asset ID de Bermejal
        origenLat: 17.8579401103632,
        origenLon: -99.6739536626923,
        escala: 1.0002526469530397,
        offset: [428637.51373973046, 1974398.0838580697, 3.8437755266563727],
        rvec: [0.00011132995333956913, -0.00003292231694213758, -0.00043669032632740194]
      },
      filos: {
        nombre: 'TAJO LOS FILOS',
        assetId: 5890537, // Reemplaza con tu Asset ID de Filos
        origenLat: 17.8579401103632,
        origenLon: -99.6739536626923,
        escala: 1.0002526469530397,
        offset: [428637.51373973046, 1974398.0838580697, 3.8437755266563727],
        rvec: [0.00011132995333956913, -0.00003292231694213758, -0.00043669032632740194]
      },
      guadalupe: {
        nombre: 'TAJO GUADALUPE',
        assetId: 5874462, // Reemplaza con tu Asset ID de Guadalupe
        origenLat: 17.8579401103632,
        origenLon: -99.6739536626923,
        escala: 1.0002526469530397,
        offset: [428637.51373973046, 1974398.0838580697, 3.8437755266563727],
        rvec: [0.00011132995333956913, -0.00003292231694213758, -0.00043669032632740194]
      }
    };

    let zonaActivaKey = 'bermejal';

    // Función de transformación que usa la zona actualmente seleccionada
    function wgs84ASistemaLocal(cartographic) {
      const cfg = CONFIG_ZONAS[zonaActivaKey];
      const lat = Cesium.Math.toDegrees(cartographic.latitude);
      const lon = Cesium.Math.toDegrees(cartographic.longitude);
      const z   = cartographic.height;

      const dLat = (lat - cfg.origenLat) * (Math.PI / 180);
      const dLon = (lon - cfg.origenLon) * (Math.PI / 180);
      const latRad = cfg.origenLat * (Math.PI / 180);

      const R = 6378137.0;
      let x = R * dLon * Math.cos(latRad);
      let y = R * dLat;
      let elev = z;

      const s = cfg.escala;
      const [rx, ry, rz] = cfg.rvec;
      const [offX, offY, offZ] = cfg.offset;

      return {
        este: (s * (x - rz * y + ry * elev) + offX).toFixed(2),
        norte: (s * (rz * x + y - rx * elev) + offY).toFixed(2),
        cota: (s * (-ry * x + rx * y + elev) + offZ).toFixed(2)
      };
    }

    // =========================================================================
    // 2. INICIALIZACIÓN DEL VIEWER (SIN ERROR 404 DE CONSOLA)
    // =========================================================================
    const viewer = new Cesium.Viewer('cesiumContainer', {
      baseLayer: false,        // Elimina el 404 del Asset 2 global
      imageryProvider: false,
      timeline: false,
      animation: false,
      baseLayerPicker: false,
      geocoder: false,
      homeButton: false,
      sceneModePicker: false,
      navigationHelpButton: false,
      infoBox: false,
      selectionIndicator: false
    });

    viewer.scene.globe.show = false;
    viewer.scene.backgroundColor = Cesium.Color.fromCssColorString('#0b0e14');

    // =========================================================================
    // 3. CARGA DINÁMICA DE MALLA 3D Y CAMBIO DE ZONA
    // =========================================================================
    let currentTileset = null;

    async function cambiarZona(claveZona) {
      if (!CONFIG_ZONAS[claveZona]) return;
      zonaActivaKey = claveZona;
      const zona = CONFIG_ZONAS[claveZona];

      // Actualizar etiqueta del HUD
      document.getElementById('hud-zona-label').innerText = `MINEPLAN: ${zona.nombre}`;

      // Limpiar mediciones o secciones previas
      limpiarTodo();

      // Remover el tileset anterior si existe
      if (currentTileset) {
        viewer.scene.primitives.remove(currentTileset);
        currentTileset = null;
      }

      try {
        const tileset = await Cesium.Cesium3DTileset.fromIonAssetId(zona.assetId);
        currentTileset = viewer.scene.primitives.add(tileset);
        viewer.zoomTo(currentTileset);
      } catch (err) {
        console.error(`Error al cargar el tileset de ${zona.nombre}:`, err);
      }
    }

    // Cargar la zona inicial (Bermejal)
    cambiarZona('bermejal');

    // =========================================================================
    // 4. EVENTO MOUSE MOVE (HUD COORDENADAS LOCALES)
    // =========================================================================
    const hudE = document.getElementById('hud-e');
    const hudN = document.getElementById('hud-n');
    const hudZ = document.getElementById('hud-z');
    const handler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);

    handler.setInputAction(function (movement) {
      const cartesian = viewer.scene.pickPosition(movement.endPosition);
      if (Cesium.defined(cartesian)) {
        const carto = Cesium.Cartographic.fromCartesian(cartesian);
        const local = wgs84ASistemaLocal(carto);
        hudE.innerText = `${local.este} m`;
        hudN.innerText = `${local.norte} m`;
        hudZ.innerText = `${local.cota} m`;
      }
    }, Cesium.ScreenSpaceEventType.MOUSE_MOVE);

    // =========================================================================
    // 5. MOTOR DE SECCIÓN TRANSVERSAL Y MEDICIONES
    // =========================================================================
    let modoActivo = null;
    let puntosTemp = [];
    let entidadesDibujadas = [];
    let chartInstance = null;

    function activarHerramienta(herramienta) {
      limpiarSeleccion();
      modoActivo = herramienta;
      document.querySelectorAll('.btn-tool').forEach(b => b.classList.remove('active'));
      const btn = document.getElementById(`btn-${herramienta}`);
      if (btn) btn.classList.add('active');
    }

    handler.setInputAction(async function (click) {
      if (!modoActivo) return;

      const cartesian = viewer.scene.pickPosition(click.position);
      if (!Cesium.defined(cartesian)) return;

      puntosTemp.push(cartesian);

      const marker = viewer.entities.add({
        position: cartesian,
        point: { pixelSize: 8, color: Cesium.Color.fromCssColorString('#c084fc'), disableDepthTestDistance: Number.POSITIVE_INFINITY }
      });
      entidadesDibujadas.push(marker);

      if (puntosTemp.length === 2) {
        const [p1, p2] = puntosTemp;

        const linea = viewer.entities.add({
          polyline: {
            positions: [p1, p2],
            width: 3,
            material: Cesium.Color.fromCssColorString('#a855f7'),
            clampToGround: false
          }
        });
        entidadesDibujadas.push(linea);

        if (modoActivo === 'seccion') {
          await ejecutarCorteSeccion(p1, p2);
        } else if (modoActivo === 'medir') {
          ejecutarMedicionDistancia(p1, p2);
        } else if (modoActivo === 'talud') {
          ejecutarMedicionTalud(p1, p2);
        }

        puntosTemp = [];
        modoActivo = null;
        document.querySelectorAll('.btn-tool').forEach(b => b.classList.remove('active'));
      }
    }, Cesium.ScreenSpaceEventType.LEFT_CLICK);

    async function ejecutarCorteSeccion(p1, p2) {
      const c1 = Cesium.Cartographic.fromCartesian(p1);
      const c2 = Cesium.Cartographic.fromCartesian(p2);

      const loc1 = wgs84ASistemaLocal(c1);
      const loc2 = wgs84ASistemaLocal(c2);

      const dH_Total = Math.hypot(loc2.este - loc1.este, loc2.norte - loc1.norte);
      const dZ_Total = parseFloat(loc2.cota) - parseFloat(loc1.cota);

      const METERS_PER_STEP = 0.5;
      const calculated = Math.round(dH_Total / METERS_PER_STEP);
      const NUM_SAMPLES = Math.min(Math.max(calculated, 60), 400);

      const maxElev = Math.max(c1.height, c2.height) + 50.0;
      const samplePoints = [];

      for (let i = 0; i <= NUM_SAMPLES; i++) {
        const t = i / NUM_SAMPLES;
        const lat = Cesium.Math.lerp(c1.latitude, c2.latitude, t);
        const lon = Cesium.Math.lerp(c1.longitude, c2.longitude, t);
        samplePoints.push(Cesium.Cartesian3.fromRadians(lon, lat, maxElev));
      }

      let clamped = [];
      try {
        clamped = await viewer.scene.clampToHeightMostDetailed(samplePoints);
      } catch (err) {
        console.warn("Fallo clamp detallado:", err);
      }

      if (!clamped || clamped.length === 0 || !clamped[0]) {
        clamped = samplePoints.map(pt => viewer.scene.clampToHeight(pt) || pt);
      }

      const distancias = [];
      const elevaciones = [];
      let distAcum = 0;
      let prevPt = null;

      for (let i = 0; i < clamped.length; i++) {
        let pt = clamped[i];
        if (!pt) {
          pt = Cesium.Cartesian3.lerp(p1, p2, i / NUM_SAMPLES, new Cesium.Cartesian3());
        }

        const carto = Cesium.Cartographic.fromCartesian(pt);
        const cotaLocal = parseFloat(wgs84ASistemaLocal(carto).cota);

        if (prevPt) {
          const dH = Cesium.Cartesian3.distance(
            new Cesium.Cartesian3(prevPt.x, prevPt.y, 0),
            new Cesium.Cartesian3(pt.x, pt.y, 0)
          );
          distAcum += dH;
        }
        prevPt = pt;

        distancias.push(distAcum.toFixed(1));
        elevaciones.push(cotaLocal);
      }

      document.getElementById('secLength').innerText = dH_Total.toFixed(1) + ' m';
      document.getElementById('secSamples').innerText = `${distancias.length} (paso ${(dH_Total / distancias.length).toFixed(2)} m)`;
      document.getElementById('secDeltaZ').innerText = (dZ_Total >= 0 ? '+' : '') + dZ_Total.toFixed(1) + ' m';

      mostrarGrafica(distancias, elevaciones);
    }

    function mostrarGrafica(labels, data) {
      const panel = document.getElementById('panel-seccion');
      panel.style.display = 'block';

      if (chartInstance) chartInstance.destroy();

      const ctx = document.getElementById('chartCanvas').getContext('2d');
      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: 'Cota de Mina (Z)',
            data: data,
            borderColor: '#38bdf8',
            backgroundColor: 'rgba(56, 189, 248, 0.15)',
            borderWidth: 2,
            fill: true,
            pointRadius: 0,
            tension: 0.1
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                title: (items) => `Dist: ${items[0].label} m`,
                label: (item) => `Cota Z: ${item.raw.toFixed(2)} m`
              }
            }
          },
          scales: {
            x: {
              title: { display: true, text: 'Distancia Progresiva Horizontal (m)', color: '#94a3b8', font: { size: 10 } },
              ticks: { color: '#64748b', maxTicksLimit: 12 },
              grid: { color: 'rgba(255, 255, 255, 0.05)' }
            },
            y: {
              title: { display: true, text: 'Cota Z (m)', color: '#94a3b8', font: { size: 10 } },
              ticks: { color: '#64748b' },
              grid: { color: 'rgba(255, 255, 255, 0.08)' }
            }
          }
        }
      });
    }

    function ejecutarMedicionDistancia(p1, p2) {
      const dist = Cesium.Cartesian3.distance(p1, p2);
      const mid = Cesium.Cartesian3.midpoint(p1, p2, new Cesium.Cartesian3());
      const label = viewer.entities.add({
        position: mid,
        label: {
          text: `Dist: ${dist.toFixed(2)} m`,
          font: '13px monospace',
          fillColor: Cesium.Color.WHITE,
          showBackground: true,
          backgroundColor: Cesium.Color.fromCssColorString('rgba(15,23,42,0.85)'),
          disableDepthTestDistance: Number.POSITIVE_INFINITY
        }
      });
      entidadesDibujadas.push(label);
    }

    function ejecutarMedicionTalud(p1, p2) {
      const c1 = Cesium.Cartographic.fromCartesian(p1);
      const c2 = Cesium.Cartographic.fromCartesian(p2);
      const dH = Math.hypot(p2.x - p1.x, p2.y - p1.y);
      const dZ = Math.abs(c2.height - c1.height);
      const grados = Cesium.Math.toDegrees(Math.atan2(dZ, dH));
      const mid = Cesium.Cartesian3.midpoint(p1, p2, new Cesium.Cartesian3());

      const label = viewer.entities.add({
        position: mid,
        label: {
          text: `Talud: ${grados.toFixed(1)}° (ΔZ: ${dZ.toFixed(1)} m)`,
          font: '13px monospace',
          fillColor: Cesium.Color.YELLOW,
          showBackground: true,
          backgroundColor: Cesium.Color.fromCssColorString('rgba(15,23,42,0.85)'),
          disableDepthTestDistance: Number.POSITIVE_INFINITY
        }
      });
      entidadesDibujadas.push(label);
    }

    function vistaPlanta() {
      if (!currentTileset) return;
      viewer.flyTo(currentTileset, {
        offset: new Cesium.HeadingPitchRange(0, Cesium.Math.toRadians(-89.9), currentTileset.boundingSphere.radius * 2.2)
      });
    }

    function vistaPerspectiva() {
      if (!currentTileset) return;
      viewer.flyTo(currentTileset, {
        offset: new Cesium.HeadingPitchRange(0, Cesium.Math.toRadians(-40), currentTileset.boundingSphere.radius * 2.0)
      });
    }

    function limpiarSeleccion() {
      puntosTemp = [];
      modoActivo = null;
    }

    function limpiarTodo() {
      limpiarSeleccion();
      entidadesDibujadas.forEach(e => viewer.entities.remove(e));
      entidadesDibujadas = [];
      cerrarSeccion();
    }

    function cerrarSeccion() {
      document.getElementById('panel-seccion').style.display = 'none';
      if (chartInstance) {
        chartInstance.destroy();
        chartInstance = null;
      }
    }
  </script>
</body>
</html>
